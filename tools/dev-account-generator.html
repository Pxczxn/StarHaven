<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星栖开发账号生成器</title>
  <style>
    :root {
      --cosmic-bg: #030207;
      --cosmic-card: rgba(15, 11, 32, 0.72);
      --text-primary: #fff;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --action-pink: #f43f5e;
      --action-cyan: #06b6d4;
      --glow-pink: rgba(244, 63, 94, 0.32);
      --glow-cyan: rgba(6, 182, 212, 0.32);
      --crystal-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-secondary);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 78% 18%, rgba(244, 63, 94, 0.10), transparent 35%),
        radial-gradient(circle at 18% 78%, rgba(6, 182, 212, 0.10), transparent 38%),
        var(--cosmic-bg);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.68) 0 1px, transparent 1px),
        radial-gradient(circle, rgba(6,182,212,.55) 0 1px, transparent 1px);
      background-size: 130px 130px, 210px 210px;
      background-position: 18px 33px, 74px 92px;
      opacity: .25;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    .kicker {
      color: var(--action-cyan);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--text-primary);
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.08;
    }

    .subtitle {
      max-width: 760px;
      margin: 0 0 24px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    code {
      color: var(--action-cyan);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, .9fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--cosmic-card);
      border: 1px solid var(--crystal-border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 22px 54px rgba(0, 0, 0, .42);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1px solid var(--crystal-border);
      background: rgba(255,255,255,.035);
      color: var(--text-primary);
      padding: 0 16px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--action-cyan);
      box-shadow: 0 0 18px rgba(6, 182, 212, .14);
    }

    .btn {
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid var(--crystal-border);
      color: var(--text-secondary);
      background: rgba(255,255,255,.035);
      font-weight: 900;
      cursor: pointer;
      transition: all .22s ease;
    }

    .btn:hover {
      color: #fff;
      border-color: rgba(6, 182, 212, .45);
      box-shadow: 0 0 20px var(--glow-cyan);
    }

    .btn.primary {
      color: #fff;
      border-color: rgba(244, 63, 94, .48);
      background: linear-gradient(135deg, rgba(244,63,94,.18), rgba(139,92,246,.16));
      box-shadow: 0 0 18px var(--glow-pink);
    }

    .message {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--action-cyan);
      font-size: 13px;
      line-height: 1.6;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .history-head h2 {
      margin: 0;
      color: var(--text-primary);
      font-size: 24px;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: grid;
      gap: 8px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }

    .history-item:hover {
      border-color: rgba(6,182,212,.34);
      background: rgba(6,182,212,.08);
    }

    .history-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .history-label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .history-value {
      min-width: 0;
      color: var(--text-primary);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(6,182,212,.2);
      color: var(--action-cyan);
      background: rgba(6,182,212,.08);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .delete-btn {
      color: var(--action-pink);
      border-color: rgba(244, 63, 94, .24);
      background: rgba(244, 63, 94, .08);
    }

    .delete-btn:hover {
      color: #fff;
      border-color: rgba(244, 63, 94, .48);
      box-shadow: 0 0 14px var(--glow-pink);
    }

    .empty {
      color: var(--text-muted);
      padding: 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      background: rgba(255,255,255,.03);
    }

    @media (max-width: 840px) {
      .page { padding: 42px 0; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 22px; }
      .toolbar { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="kicker">DEV ACCOUNT TOOL</div>
      <h1>星栖随机租客账号</h1>
      <p class="subtitle">
        独立开发工具页，不接入 H5 主业务路由。历史账号会从同目录的
        <code>dev-account-history.js</code> 自动读取，离线直接打开 HTML 也能用。
      </p>
    </header>

    <div class="grid">
      <section class="card">
        <div class="toolbar">
          <button class="btn" id="generateBtn">重新生成</button>
          <button class="btn primary" id="saveBtn">导出历史文件</button>
          <button class="btn" id="copyAllBtn">复制全部</button>
        </div>

        <div class="field">
          <label for="realName">姓名</label>
          <input id="realName" />
        </div>
        <div class="field">
          <label for="phone">手机号</label>
          <input id="phone" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" />
        </div>
        <div class="field">
          <label for="idNumber">身份证号</label>
          <input id="idNumber" />
        </div>

        <div class="message" id="message"></div>
      </section>

      <section class="card">
        <div class="history-head">
          <div>
            <div class="kicker">FILE HISTORY</div>
            <h2>历史账号</h2>
          </div>
          <button class="btn" id="clearBtn">清空</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </div>
  </main>

  <script src="./dev-account-history.js"></script>
  <script>
    const HISTORY_KEY = 'tenantLoginHistory';
    const HISTORY_FILE_NAME = 'dev-account-history.js';
    const $ = (id) => document.getElementById(id);
    let history = [];

    function readLocalHistory() {
      try { return normalizeHistory(JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]')); }
      catch { return []; }
    }

    function writeLocalHistory(nextHistory) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(nextHistory));
    }

    function normalizeHistory(value) {
      if (Array.isArray(value)) return value;
      if (Array.isArray(value.accounts)) return value.accounts;
      return [];
    }

    function historyFileContent() {
      return `window.DEV_ACCOUNT_HISTORY = ${JSON.stringify({
        updatedAt: new Date().toISOString(),
        accounts: history,
      }, null, 2)};\n`;
    }

    function exportHistoryFile() {
      writeLocalHistory(history);
      const blob = new Blob([historyFileContent()], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = HISTORY_FILE_NAME;
      link.click();
      URL.revokeObjectURL(url);
    }

    function generateIdNumber() {
      const areas = ['110101', '310101', '320102', '330102', '440103', '420102', '510104', '610102'];
      const area = areas[Math.floor(Math.random() * areas.length)];
      const year = 1985 + Math.floor(Math.random() * 24);
      const month = String(1 + Math.floor(Math.random() * 12)).padStart(2, '0');
      const day = String(1 + Math.floor(Math.random() * 28)).padStart(2, '0');
      const sequence = String(1 + Math.floor(Math.random() * 998)).padStart(3, '0');
      const body = `${area}${year}${month}${day}${sequence}`;
      const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
      const checkCodes = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
      const sum = body.split('').reduce((total, digit, index) => total + Number(digit) * weights[index], 0);
      return `${body}${checkCodes[sum % 11]}`;
    }

    function generateAccount() {
      const surnames = ['张', '王', '李', '赵', '刘', '陈', '杨', '黄', '周', '吴'];
      const names = ['星河', '云栖', '晨光', '晓月', '安然', '若尘', '南星', '知夏', '景行', '清欢'];
      const prefixes = ['130', '131', '132', '133', '135', '136', '137', '138', '150', '151', '152', '157', '158', '180', '181', '186', '187', '188'];
      $('realName').value = surnames[Math.floor(Math.random() * surnames.length)] + names[Math.floor(Math.random() * names.length)];
      $('phone').value = prefixes[Math.floor(Math.random() * prefixes.length)] + String(Math.floor(Math.random() * 100000000)).padStart(8, '0');
      $('password').value = `dev${String(Math.floor(Math.random() * 1000000)).padStart(6, '0')}`;
      $('idNumber').value = generateIdNumber();
      $('message').textContent = '';
    }

    function currentAccount() {
      return {
        realName: $('realName').value.trim(),
        phone: $('phone').value.trim(),
        password: $('password').value.trim(),
        idNumber: $('idNumber').value.trim().toUpperCase(),
        savedAt: Date.now(),
      };
    }

    function validateAccount(account) {
      if (!account.realName) return '请输入姓名';
      if (!/^1[3-9]\d{9}$/.test(account.phone)) return '手机号格式不正确';
      if (account.password.length < 6) return '密码至少 6 位';
      if (!/^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dX]$/.test(account.idNumber)) return '身份证号格式不正确';
      return '';
    }

    async function copyValue(value) {
      try {
        await navigator.clipboard.writeText(value || '');
        $('message').textContent = '已复制。';
      } catch {
        $('message').textContent = '复制失败，请手动复制。';
      }
    }

    function accountText(account) {
      return `姓名：${account.realName}\n手机号：${account.phone}\n密码：${account.password}\n身份证号：${account.idNumber}`;
    }

    async function handleSave() {
      const account = currentAccount();
      const error = validateAccount(account);
      if (error) {
        $('message').textContent = error;
        return;
      }
      history = [account, ...history.filter((item) => item.phone !== account.phone)].slice(0, 50);
      renderHistory();
      exportHistoryFile();
      $('message').textContent = `已下载 ${HISTORY_FILE_NAME}，请覆盖 tools 目录下的同名文件。`;
    }

    function handleDeleteAccount(phone) {
      history = history.filter((item) => item.phone !== phone);
      writeLocalHistory(history);
      renderHistory();
      exportHistoryFile();
      $('message').textContent = `已删除该账号，并下载新的 ${HISTORY_FILE_NAME}。`;
    }

    function renderHistory() {
      const list = $('historyList');
      list.innerHTML = '';
      if (!history.length) {
        list.innerHTML = '<div class="empty">暂无历史账号，保存后会显示在这里。</div>';
        return;
      }

      for (const item of history) {
        const card = document.createElement('div');
        card.className = 'history-item';
        const rows = [
          ['姓名', item.realName || item.phone],
          ['手机号', item.phone || ''],
          ['密码', item.password || ''],
          ['身份证', item.idNumber || ''],
        ];
        card.innerHTML = rows.map(([label, value]) => `
          <div class="history-row">
            <span class="history-label">${label}</span>
            <span class="history-value">${value || '-'}</span>
            <button type="button" class="copy-btn" data-copy="${value || ''}">复制</button>
          </div>
        `).join('');
        card.insertAdjacentHTML('beforeend', `
          <div class="history-row">
            <span class="history-label">操作</span>
            <span class="history-value">删除后请覆盖同目录历史文件</span>
            <button type="button" class="copy-btn delete-btn" data-delete="${item.phone || ''}">删除</button>
          </div>
        `);
        card.addEventListener('click', (event) => {
          const deleteTarget = event.target.closest('[data-delete]');
          if (deleteTarget) {
            handleDeleteAccount(deleteTarget.dataset.delete);
            return;
          }
          const copyTarget = event.target.closest('[data-copy]');
          if (copyTarget) {
            copyValue(copyTarget.dataset.copy);
            return;
          }
          $('realName').value = item.realName || '';
          $('phone').value = item.phone || '';
          $('password').value = item.password || '';
          $('idNumber').value = item.idNumber || '';
          $('message').textContent = '已填入历史账号。';
        });
        list.appendChild(card);
      }
    }

    $('generateBtn').addEventListener('click', generateAccount);
    $('saveBtn').addEventListener('click', handleSave);
    $('copyAllBtn').addEventListener('click', () => {
      const account = currentAccount();
      const error = validateAccount(account);
      if (error) {
        $('message').textContent = error;
        return;
      }
      copyValue(accountText(account));
    });
    $('clearBtn').addEventListener('click', async () => {
      history = [];
      writeLocalHistory(history);
      renderHistory();
      exportHistoryFile();
      $('message').textContent = `已清空，并下载空的 ${HISTORY_FILE_NAME}。`;
    });

    history = normalizeHistory(window.DEV_ACCOUNT_HISTORY);
    if (!history.length) {
      history = readLocalHistory();
    } else {
      writeLocalHistory(history);
    }
    generateAccount();
    renderHistory();
  </script>
</body>
</html>
